name: Build Arcana Tarot for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python for the build only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ArcanaTarot ArcanaTarot.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ArcanaTarot-Windows-EXE
          path: dist/ArcanaTarot.exe
          if-no-files-found: error
